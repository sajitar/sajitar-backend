networks:
  sajitar-backend-network:
    name: sajitar-backend-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24

volumes:
  redis-data:

services:
  postgres:
    image: postgres:18.6
    container_name: sajitar-postgres
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.10
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sajitar-db
    restart: unless-stopped

  # Instância dedicada às sessões de /tokens:
  # AUTH e ACL obrigatórios, sem eviction (TTL e teto de sessões limitam o
  # crescimento), AOF ligado e volume em /data para não revogar sessões em
  # restart, reboot ou compose down (sem -v).
  redis:
    image: redis:8.2.9-alpine
    container_name: sajitar-redis
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.25
    ports:
      - 6379:6379
    volumes:
      - ./docker/redis/users.acl:/etc/redis/users.acl:ro
      - redis-data:/data
    command: redis-server --aclfile /etc/redis/users.acl --maxmemory-policy noeviction --appendonly yes
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --user
        - sajitar
        - --pass
        - sajitar_dev
        - --no-auth-warning
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sajitar-pgadmin
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.15
    ports:
      - 15432:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.host
      PGADMIN_DEFAULT_PASSWORD: 123456
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: sajitar-redisinsight
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.30
    ports:
      - 16379:5540
    restart: unless-stopped

  # SMTP de desenvolvimento (inbox efêmera). Nos perfis LOCAL, DOCKER e DEMO a
  # aplicação envia por MailpitMailer; compose down ou recreate esvazia a caixa.
  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: sajitar-mailpit
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.35
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  springboot:
    image: eclipse-temurin:25-jdk
    container_name: sajitar-springboot
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.20
    ports:
      - 8080:8080
    volumes:
      - ./:/app
    working_dir: /app
    stdin_open: true
    tty: true
    command: >
      sh -c "apt-get update && apt-get install -y git && tail -f /dev/null"
    restart: unless-stopped
