networks:
  sajitar-backend-network:
    name: sajitar-backend-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24

volumes:
  redis-data:

services:
  postgres:
    image: postgres:18.6
    container_name: sajitar-postgres
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.10
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped

  # Instância dedicada às sessões de /tokens (docs/proposals/jwt.md, seção 4.3):
  # AUTH e ACL obrigatórios, sem eviction (TTL e teto de sessões limitam o
  # crescimento), AOF ligado e volume em /data para não revogar sessões em
  # restart, reboot ou compose down (sem -v).
  redis:
    image: redis:8.2.9-alpine
    container_name: sajitar-redis
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.25
    ports:
      - 6379:6379
    volumes:
      - ./docker/redis/users.acl:/etc/redis/users.acl:ro
      - redis-data:/data
    command: redis-server --aclfile /etc/redis/users.acl --maxmemory-policy noeviction --appendonly yes
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --user
        - ${SPRING_DATA_REDIS_USERNAME}
        - --pass
        - ${SPRING_DATA_REDIS_PASSWORD}
        - --no-auth-warning
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sajitar-pgadmin
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.15
    ports:
      - 15432:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: sajitar-redisinsight
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.30
    ports:
      - 16379:5540
    restart: unless-stopped

  # SMTP de desenvolvimento (inbox efêmera). No perfil LOCAL a aplicação envia
  # por MailpitMailer para este host; compose down ou recreate esvazia a caixa.
  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: sajitar-mailpit
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.35
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  springboot:
    image: eclipse-temurin:26-jdk
    container_name: sajitar-springboot
    networks:
      sajitar-backend-network:
        ipv4_address: 10.0.0.20
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.0.10:5432/${POSTGRES_DB}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE}
      SPRING_SQL_BEFORE_FRAMEWORK: ${SPRING_SQL_BEFORE_FRAMEWORK}
      SPRING_SQL_AFTER_FRAMEWORK: ${SPRING_SQL_AFTER_FRAMEWORK}
      SAJITAR_DOMAIN_VALIDATION_PROFILE_BIRTHDAY_MIN_AGE_YEARS: ${SAJITAR_DOMAIN_VALIDATION_PROFILE_BIRTHDAY_MIN_AGE_YEARS}
      SAJITAR_DOMAIN_VALIDATION_LIMIT_MAX: ${SAJITAR_DOMAIN_VALIDATION_LIMIT_MAX}
      SAJITAR_PROFILE_UNVERIFIED_MAX_AGE_HOURS: ${SAJITAR_PROFILE_UNVERIFIED_MAX_AGE_HOURS:-48}
      SAJITAR_PROFILE_UNVERIFIED_PURGE_ZONE: ${SAJITAR_PROFILE_UNVERIFIED_PURGE_ZONE:-America/Sao_Paulo}
      SAJITAR_SECURITY_JWT_SECRET: ${SAJITAR_SECURITY_JWT_SECRET:-01234567890123456789012345678901}
      SAJITAR_SECURITY_JWT_EXPIRATION_SECONDS: ${SAJITAR_SECURITY_JWT_EXPIRATION_SECONDS:-3600}
      SAJITAR_SECURITY_JWT_REFRESH_EXPIRATION_SECONDS: ${SAJITAR_SECURITY_JWT_REFRESH_EXPIRATION_SECONDS:-604800}
      SAJITAR_SECURITY_JWT_SESSION_MAX_SECONDS: ${SAJITAR_SECURITY_JWT_SESSION_MAX_SECONDS:-2592000}
      SAJITAR_SECURITY_JWT_MAX_SESSIONS_PER_PROFILE: ${SAJITAR_SECURITY_JWT_MAX_SESSIONS_PER_PROFILE:-10}
      SAJITAR_SECURITY_JWT_REFRESH_GRACE_SECONDS: ${SAJITAR_SECURITY_JWT_REFRESH_GRACE_SECONDS:-15}
      SAJITAR_SECURITY_JWT_ISSUER: ${SAJITAR_SECURITY_JWT_ISSUER:-sajitar-backend}
      SAJITAR_SECURITY_JWT_AUDIENCE: ${SAJITAR_SECURITY_JWT_AUDIENCE:-sajitar-app}
      SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_MAX: ${SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_MAX:-10}
      SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_WINDOW_SECONDS: ${SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_WINDOW_SECONDS:-300}
      SAJITAR_SECURITY_ATTEMPT_REFRESH_MAX: ${SAJITAR_SECURITY_ATTEMPT_REFRESH_MAX:-30}
      SAJITAR_SECURITY_ATTEMPT_REFRESH_WINDOW_SECONDS: ${SAJITAR_SECURITY_ATTEMPT_REFRESH_WINDOW_SECONDS:-60}
      SAJITAR_SECURITY_ATTEMPT_TRUST_FORWARDED_FOR: ${SAJITAR_SECURITY_ATTEMPT_TRUST_FORWARDED_FOR:-false}
      SPRING_DATA_REDIS_HOST: 10.0.0.25
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: ${SPRING_DATA_REDIS_USERNAME}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_DATA_REDIS_SSL_ENABLED: ${SPRING_DATA_REDIS_SSL_ENABLED}
      SPRING_PROFILES_ACTIVE: LOCAL
      SAJITAR_MAIL_HOST: 10.0.0.35
      SAJITAR_MAIL_PORT: 1025
      SAJITAR_MAIL_FROM: noreply@localhost
    volumes:
      - ./:/app
    working_dir: /app
    stdin_open: true
    tty: true
    command: >
      sh -c "apt-get update && apt-get install -y git && tail -f /dev/null"
    restart: unless-stopped
