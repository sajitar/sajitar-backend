# 1) Política de branches. 2) Só após sucesso: testes unitários + JaCoCo (cobertura mínima no pom.xml).
# O job de testes sobe PostgreSQL (mesma stack do application.yml) e define as variáveis obrigatórias do Spring.
# Em Branch protection rules, exija os dois jobs: "Validar nomenclatura…" e "Testes unitários e cobertura (JaCoCo)".
# Ver também docs/POLITICA-DE-BRANCHES.md.

name: Política de branches e cobertura

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Validar nomenclatura e fluxo de branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar validações
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/validate-branch-policy.sh

  unit-tests-jacoco:
    name: Testes unitários e cobertura (JaCoCo)
    runs-on: ubuntu-latest
    needs: branch-policy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sajitar_ci
          POSTGRES_PASSWORD: sajitar_ci
          POSTGRES_DB: sajitar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sajitar_ci -d sajitar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Em ubuntu-latest sem job.container, a porta do serviço fica em localhost no runner.
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sajitar_ci
      SPRING_DATASOURCE_USERNAME: sajitar_ci
      SPRING_DATASOURCE_PASSWORD: sajitar_ci
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_BEFORE_FRAMEWORK: classpath:util/functions.sql
      SPRING_SQL_AFTER_FRAMEWORK: util/columns.sql, util/indexes.sql, settlement/profile.sql
      SAJITAR_DOMAIN_VALIDATION_PROFILE_BIRTHDAY_MIN_AGE_YEARS: 18
      SAJITAR_DOMAIN_VALIDATION_LIMIT_MAX: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tornar o Maven Wrapper executável
        run: chmod +x mvnw

      - name: Executar testes e verificar cobertura
        run: ./mvnw -B --no-transfer-progress verify

      - name: Armazenar relatório JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
