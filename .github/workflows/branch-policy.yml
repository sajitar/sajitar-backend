# 1) Política de branches. 2) Só após sucesso: testes unitários + JaCoCo (cobertura mínima no pom.xml).
# Em Branch protection rules, exija os dois jobs: "Validar nomenclatura…" e "Testes unitários e cobertura (JaCoCo)".
# Ver também docs/POLITICA-DE-BRANCHES.md.

name: Política de branches e cobertura

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - "**"

concurrency:
  group: branch-policy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Validar nomenclatura e fluxo de branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar validações
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/validate-branch-policy.sh

  unit-tests-jacoco:
    name: Testes unitários e cobertura (JaCoCo)
    runs-on: ubuntu-latest
    needs: branch-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes e verificar cobertura
        run: mvn -B --no-transfer-progress verify

      - name: Armazenar relatório JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
