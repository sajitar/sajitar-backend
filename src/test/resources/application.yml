# Mesma cadeia que ambiente local (.env: functions → Hibernate DDL → columns, indexes, settlement)
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:util/functions.sql
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          '[import_files]': util/columns.sql, util/indexes.sql, settlement/profile.sql
sajitar:
  domain:
    validation:
      profile:
        birthday:
          min-age-years: 18
      limit:
        max: 100
