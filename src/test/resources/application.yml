# Mesma cadeia que ambiente local (local.env: functions → Hibernate DDL → columns, uniques, indexes, settlement)
# Perfil `test` evita o MailpitMailer do LOCAL: o CI não sobe Mailpit.
spring:
  profiles:
    active: test
  sql:
    init:
      mode: always
      schema-locations: classpath:util/functions.sql
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          '[import_files]': util/columns.sql, util/uniques.sql, util/indexes.sql, settlement/profile.sql, settlement/checker.sql, settlement/authority.sql, settlement/note.sql
  # Redis das sessões de /tokens: mesmas credenciais de docker/redis/users.acl.
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      username: sajitar
      password: sajitar_dev
      ssl:
        enabled: false
      connect-timeout: 2s
      timeout: 2s
sajitar:
  domain:
    validation:
      profile:
        birthday:
          min-age-years: 18
      limit:
        max: 100
  profile:
    unverified-max-age-hours: 48
    unverified-purge-zone: UTC
  security:
    jwt:
      secret: "01234567890123456789012345678901"
      expiration-seconds: 3600
      refresh-expiration-seconds: 604800
      session-max-seconds: 2592000
      max-sessions-per-profile: 10
      refresh-grace-seconds: 15
      issuer: sajitar-backend
      audience: sajitar-app
    attempt:
      credentials-max: 5
      credentials-window-seconds: 60
      refresh-max: 5
      refresh-window-seconds: 60
      trust-forwarded-for: false
