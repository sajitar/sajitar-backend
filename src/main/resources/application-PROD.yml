server:
  port: ${SERVER_PORT}
spring:
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      username: ${SPRING_DATA_REDIS_USERNAME}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED}
      connect-timeout: 2s
      timeout: 2s
sajitar:
  schema:
    before: util/functions.sql,util/enums.sql
    after: util/columns.sql, util/uniques.sql, util/indexes.sql
  mail:
    host: ${SAJITAR_MAIL_HOST}
    port: ${SAJITAR_MAIL_PORT}
    from: ${SAJITAR_MAIL_FROM}
    username: ${SAJITAR_MAIL_USERNAME}
    password: ${SAJITAR_MAIL_PASSWORD}
    start-tls: ${SAJITAR_MAIL_START_TLS}
  domain:
    validation:
      profile:
        birthday:
          min-age-years: ${SAJITAR_DOMAIN_VALIDATION_PROFILE_BIRTHDAY_MIN_AGE_YEARS}
      limit:
        max: ${SAJITAR_DOMAIN_VALIDATION_LIMIT_MAX}
  profile:
    unverified-max-age-minutes: ${SAJITAR_PROFILE_UNVERIFIED_MAX_AGE_MINUTES}
    change-password-max-age-minutes: ${SAJITAR_PROFILE_CHANGE_PASSWORD_MAX_AGE_MINUTES}
    change-email-max-age-minutes: ${SAJITAR_PROFILE_CHANGE_EMAIL_MAX_AGE_MINUTES}
    delete-profile-max-age-minutes: ${SAJITAR_PROFILE_DELETE_PROFILE_MAX_AGE_MINUTES}
    sign-in-max-age-minutes: ${SAJITAR_PROFILE_SIGN_IN_MAX_AGE_MINUTES}
    unverified-purge-zone: ${SAJITAR_PROFILE_UNVERIFIED_PURGE_ZONE}
  security:
    jwt:
      secret: ${SAJITAR_SECURITY_JWT_SECRET}
      expiration-seconds: ${SAJITAR_SECURITY_JWT_EXPIRATION_SECONDS}
      refresh-expiration-seconds: ${SAJITAR_SECURITY_JWT_REFRESH_EXPIRATION_SECONDS}
      session-max-seconds: ${SAJITAR_SECURITY_JWT_SESSION_MAX_SECONDS}
      max-sessions-per-profile: ${SAJITAR_SECURITY_JWT_MAX_SESSIONS_PER_PROFILE}
      refresh-grace-seconds: ${SAJITAR_SECURITY_JWT_REFRESH_GRACE_SECONDS}
      issuer: ${SAJITAR_SECURITY_JWT_ISSUER}
      audience: ${SAJITAR_SECURITY_JWT_AUDIENCE}
    attempt:
      credentials-max: ${SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_MAX}
      credentials-window-seconds: ${SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_WINDOW_SECONDS}
      refresh-max: ${SAJITAR_SECURITY_ATTEMPT_REFRESH_MAX}
      refresh-window-seconds: ${SAJITAR_SECURITY_ATTEMPT_REFRESH_WINDOW_SECONDS}
      trust-forwarded-for: ${SAJITAR_SECURITY_ATTEMPT_TRUST_FORWARDED_FOR}
