server:
  port: 8080
spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE}
      schema-locations: ${SPRING_SQL_BEFORE_FRAMEWORK}
      encoding: UTF-8
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL}
    properties:
      hibernate:
        '[format_sql]': true
        hbm2ddl:
          '[import_files]': ${SPRING_SQL_AFTER_FRAMEWORK}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      username: ${SPRING_DATA_REDIS_USERNAME}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED}
      # Curto de propósito: sem Redis não se emite nem se valida token (503).
      connect-timeout: 2s
      timeout: 2s
sajitar:
  domain:
    validation:
      profile:
        birthday:
          min-age-years: ${SAJITAR_DOMAIN_VALIDATION_PROFILE_BIRTHDAY_MIN_AGE_YEARS}
      limit:
        max: ${SAJITAR_DOMAIN_VALIDATION_LIMIT_MAX}
  security:
    jwt:
      secret: "01234567890123456789012345678901"
      expiration-seconds: ${SAJITAR_SECURITY_JWT_EXPIRATION_SECONDS}
      refresh-expiration-seconds: ${SAJITAR_SECURITY_JWT_REFRESH_EXPIRATION_SECONDS}
      session-max-seconds: ${SAJITAR_SECURITY_JWT_SESSION_MAX_SECONDS}
      max-sessions-per-profile: ${SAJITAR_SECURITY_JWT_MAX_SESSIONS_PER_PROFILE}
      refresh-grace-seconds: ${SAJITAR_SECURITY_JWT_REFRESH_GRACE_SECONDS}
      issuer: ${SAJITAR_SECURITY_JWT_ISSUER}
      audience: ${SAJITAR_SECURITY_JWT_AUDIENCE}
    attempt:
      credentials-max: ${SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_MAX}
      credentials-window-seconds: ${SAJITAR_SECURITY_ATTEMPT_CREDENTIALS_WINDOW_SECONDS}
      refresh-max: ${SAJITAR_SECURITY_ATTEMPT_REFRESH_MAX}
      refresh-window-seconds: ${SAJITAR_SECURITY_ATTEMPT_REFRESH_WINDOW_SECONDS}
      trust-forwarded-for: ${SAJITAR_SECURITY_ATTEMPT_TRUST_FORWARDED_FOR:false}

---
spring:
  config:
    activate:
      on-profile: LOCAL
sajitar:
  mail:
    host: ${SAJITAR_MAIL_HOST:127.0.0.1}
    port: ${SAJITAR_MAIL_PORT:1025}
    from: ${SAJITAR_MAIL_FROM:noreply@localhost}
