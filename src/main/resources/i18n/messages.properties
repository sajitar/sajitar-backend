validation.not-null=must not be null
validation.size.max=must contain at most {max} characters
validation.size.range=must contain between {min} and {max} characters
validation.name.pattern=must be a well-formed name
validation.email.format=must be a well-formed email address
validation.email.already-registered=must be an unregistered email
validation.birthday.min-age=must be older than {minAge} years
validation.limit.range=must be a positive number less than or equal to {configuredMax}
validation.type.mismatch=must belong to type {0}
