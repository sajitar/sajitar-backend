validation.not-null=must not be null
validation.not-blank=must not be blank
validation.size.max=must contain at most {max} characters
validation.size.range=must contain between {min} and {max} characters
validation.name.pattern=must be a well-formed name
validation.email.format=must be a well-formed email address
validation.email.already-registered=must be an unregistered email
validation.birthday.min-age=must be older than {minAge} years
validation.limit.range=must be a positive number less than or equal to {configuredMax}
validation.type.mismatch=must belong to type {0}
validation.code.pattern=must contain exactly 6 digits
validation.attempts.range=must be between 0 and 10
validation.replaces.range=must be between 0 and 3
validation.checker.type.not-found=value not found ''{0}'' from ''Checker.Type''
validation.checker.type.already-exists=must be an available type
validation.checker.type.create-restricted=must be created internally by the system
validation.checker.replaces.exhausted=must be greater than 0
validation.authority.type.not-found=value not found ''{0}'' from ''Authority.Type''
validation.authority.type.already-exists=must be an available type
validation.note.type.not-found=value not found ''{0}'' from ''Note.Type''
validation.profile.must-be-available=must be available
