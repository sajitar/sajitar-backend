<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{title}}</title>
<style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    @media only screen and (max-width: 520px) {
        .mail-shell { width: 100% !important; }
        .mail-pad { padding: 28px 20px !important; }
        .mail-code { font-size: 28px !important; letter-spacing: 0.28em !important; }
    }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f4f1ea;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f1ea;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" class="mail-shell" cellpadding="0" cellspacing="0" border="0" width="480" style="width:480px;max-width:480px;background-color:#fffcf7;border:1px solid #e6dfd2;border-radius:16px;">
                <tr>
                    <td class="mail-pad" style="padding:40px 40px 32px 40px;font-family:Georgia,'Times New Roman',serif;color:#1c1915;">
                        <p style="margin:0 0 28px 0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#6b6358;">Sajitar</p>
                        <h1 style="margin:0 0 12px 0;font-size:28px;line-height:1.25;font-weight:normal;color:#1c1915;">{{heading}}</h1>
                        <p style="margin:0 0 28px 0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;color:#4a453e;">{{lead}}</p>
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 12px 0;">
                            <tr>
                                <td align="center" style="background-color:#1c1915;border-radius:12px;padding:22px 16px;">
                                    <p class="mail-code" style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;line-height:1.2;letter-spacing:0.32em;color:#fffcf7;">{{code}}</p>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0 0 28px 0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;color:#4a453e;">{{hint}}</p>
                        <p style="margin:0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5;color:#8a8278;">{{footer}}</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
